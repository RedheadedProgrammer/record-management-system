databases:
  - name: record-management-db
    databaseName: record_management
    user: record_management_user
    plan: free

services:
  - type: web
    name: record-management-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: record-management-db
          property: connectionString
      - key: CLIENT_URL
        value: https://record-management-client.onrender.com

  - type: web
    name: record-management-client
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    rootDir: record-management-client
    envVars:
      - key: REACT_APP_API_URL
        value: https://record-management-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html